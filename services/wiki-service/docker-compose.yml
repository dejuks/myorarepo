
# Standalone compose file for developing wiki-service in isolation, mirroring
# user-service's own docker-compose.yml. The full-platform compose file
# (infra/docker-compose.yml) brings up every service together.

services:
  wiki-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ora/wiki-service:latest
    container_name: ora-wiki-service
    restart: unless-stopped
    ports:
      - "4008:4008"
    environment:
      NODE_ENV: production
      PORT: 4008
      SERVICE_NAME: wiki-service
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USERNAME: wiki_service_user
      DB_PASSWORD: wiki_service_password
      DB_DATABASE: wiki_db
      DB_SSL: "false"
      # Must match the platform's shared JWT signing secret — see .env.example note on shared HS256 secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_ISSUER: ora-platform
      JWT_AUDIENCE: ora-platform-clients
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      LOG_LEVEL: info
    depends_on:
      wiki-db:
        condition: service_healthy
    networks:
      - ora-network

  wiki-db:
    image: postgres:16-alpine
    container_name: ora-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki_service_user
      POSTGRES_PASSWORD: wiki_service_password
      POSTGRES_DB: wiki_db
    volumes:
      - wiki-db-data:/var/lib/postgresql/data
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_service_user -d wiki_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  wiki-db-data:
