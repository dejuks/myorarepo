
# Standalone compose file for developing journal-service in isolation,
# mirroring user-service's own docker-compose.yml (minus Redis/RabbitMQ —
# this service is fully standalone RBAC with zero runtime dependency on any
# other service). The full-platform compose file (infra/docker-compose.yml)
# brings up every service together.

services:
  journal-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ora/journal-service:latest
    container_name: ora-journal-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      NODE_ENV: production
      PORT: 4005
      SERVICE_NAME: journal-service
      DB_HOST: journal-db
      DB_PORT: 5432
      DB_USERNAME: journal_service_user
      DB_PASSWORD: journal_service_password
      DB_DATABASE: journal_db
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_ISSUER: ora-platform
      JWT_AUDIENCE: ora-platform-clients
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      LOG_LEVEL: info
    depends_on:
      journal-db:
        condition: service_healthy
    networks:
      - ora-network

  journal-db:
    image: postgres:16-alpine
    container_name: ora-journal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal_service_user
      POSTGRES_PASSWORD: journal_service_password
      POSTGRES_DB: journal_db
    volumes:
      - journal-db-data:/var/lib/postgresql/data
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_service_user -d journal_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  journal-db-data:
