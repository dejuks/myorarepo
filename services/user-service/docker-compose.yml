
# Standalone compose file for developing user-service in isolation, mirroring
# auth-service's own docker-compose.yml. The full-platform compose file
# (infra/docker-compose.yml) brings up every service together.

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ora/user-service:latest
    container_name: ora-user-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      SERVICE_NAME: user-service
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USERNAME: user_service_user
      DB_PASSWORD: user_service_password
      DB_DATABASE: user_db
      DB_SSL: "false"
      # Must match auth-service's JWT_ACCESS_SECRET — see .env.example note on shared HS256 secret.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_ISSUER: ora-platform
      JWT_AUDIENCE: ora-platform-clients
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ora.user.events
      LOG_LEVEL: info
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ora-network

  user-db:
    image: postgres:16-alpine
    container_name: ora-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: user_service_password
      POSTGRES_DB: user_db
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

  redis:
    image: redis:7-alpine
    container_name: ora-user-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ora-user-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  user-db-data:
