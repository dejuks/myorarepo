
# Standalone compose file for developing repository-service in isolation,
# mirroring user-service's own docker-compose.yml. The full-platform compose
# file (infra/docker-compose.yml) brings up every service together.

services:
  repository-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ora/repository-service:latest
    container_name: ora-repository-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      SERVICE_NAME: repository-service
      DB_HOST: repository-db
      DB_PORT: 5432
      DB_USERNAME: repository_service_user
      DB_PASSWORD: repository_service_password
      DB_DATABASE: repository_db
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_ISSUER: ora-platform
      JWT_AUDIENCE: ora-platform-clients
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      LOG_LEVEL: info
    depends_on:
      repository-db:
        condition: service_healthy
    networks:
      - ora-network

  repository-db:
    image: postgres:16-alpine
    container_name: ora-repository-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repository_service_user
      POSTGRES_PASSWORD: repository_service_password
      POSTGRES_DB: repository_db
    volumes:
      - repository-db-data:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repository_service_user -d repository_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  repository-db-data:
