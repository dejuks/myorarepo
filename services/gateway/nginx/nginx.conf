# Reference Nginx config for TLS termination in front of the gateway
# (docs/01-architecture.md §2/§12). In docker-compose.yml this container
# sits in front of the gateway service; certificates are mounted from a
# host path or an ACME sidecar in real deployments.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream ora_gateway {
    server gateway:8080;
  }

  # Basic edge rate limiting ahead of the gateway's own express-rate-limit — belt and suspenders.
  limit_req_zone $binary_remote_addr zone=ora_edge:10m rate=20r/s;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location / {
      limit_req zone=ora_edge burst=40 nodelay;

      proxy_pass http://ora_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
  }
}
