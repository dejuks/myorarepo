
# Standalone compose file for developing library-service in isolation,
# mirroring user-service's own docker-compose.yml shape. No Redis, no
# RabbitMQ — this service is fully standalone RBAC (see docs/erd.md). The
# full-platform compose file (infra/docker-compose.yml) brings up every
# service together.

services:
  library-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ora/library-service:latest
    container_name: ora-library-service
    restart: unless-stopped
    ports:
      - "4007:4007"
    environment:
      NODE_ENV: production
      PORT: 4007
      SERVICE_NAME: library-service
      DB_HOST: library-db
      DB_PORT: 5432
      DB_USERNAME: library_service_user
      DB_PASSWORD: library_service_password
      DB_DATABASE: library_db
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
      JWT_ISSUER: ora-platform
      JWT_AUDIENCE: ora-platform-clients
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      LOG_LEVEL: info
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - ora-network

  library-db:
    image: postgres:16-alpine
    container_name: ora-library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: library_service_user
      POSTGRES_PASSWORD: library_service_password
      POSTGRES_DB: library_db
    volumes:
      - library-db-data:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_service_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ora-network

networks:
  ora-network:
    driver: bridge

volumes:
  library-db-data:
