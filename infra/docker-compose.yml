
# Full local platform stack — brings up every service built so far, each
# with its own database, on one shared network, plus the gateway in front
# of them and shared RabbitMQ/Redis. This is the "one command" dev
# environment referenced in docs/01-architecture.md §12.
#
# Usage (from the ora-platform repo root):
#   docker compose -f infra/docker-compose.yml up --build
#
# Then open, in a browser:
#   http://localhost:3000                -> web frontend (login/register/dashboard)
#   http://localhost:8080/health/ready   -> gateway's aggregated health check
#   http://localhost:4001/api-docs       -> auth-service Swagger UI
#   http://localhost:4002/api-docs       -> user-service Swagger UI
#   http://localhost:4009/api-docs       -> notification-service Swagger UI
#   http://localhost:4010/api-docs       -> search-service Swagger UI
#
# All business traffic should go through the gateway on :8080 (e.g.
# POST http://localhost:8080/api/v1/auth/register), which is what a real
# client would call — the direct service ports above are exposed only so
# you can reach each service's own Swagger UI for interactive testing.
#
# First login: a super-admin account is auto-seeded on first boot from the
# SUPER_ADMIN_* vars below (default admin@ora.local / ChangeMe123! — see
# x-super-admin-env). CHANGE THE PASSWORD before this ever runs anywhere
# beyond your own machine (override SUPER_ADMIN_PASSWORD via a real
# environment variable or a .env file — never edit the default in place).
# The seed is idempotent: safe to leave configured across every restart,
# it only ever creates the account once.

x-jwt-env: &jwt-env
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me_32_chars_min}
  JWT_ISSUER: ora-platform
  JWT_AUDIENCE: ora-platform-clients

# Shared between auth-service and user-service so the seeded account's
# email can't accidentally drift between the two (see
# services/*/src/infrastructure/bootstrap/super-admin.bootstrap.ts — both
# derive the same user id from this same email via UUID v5). Set
# SUPER_ADMIN_EMAIL="" (or leave the whole block unset) to disable seeding.
x-super-admin-env: &super-admin-env
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}

services:
  # ---------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ora-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # auth-service + its database
  # ---------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: ora-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_service_user
      POSTGRES_PASSWORD: auth_service_password
      POSTGRES_DB: auth_db
    volumes: [auth-db-data:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  auth-service:
    build: { context: ../services/auth-service, dockerfile: Dockerfile }
    container_name: ora-auth-service
    restart: unless-stopped
    ports: ["4001:4001"]
    environment:
      <<: [*jwt-env, *super-admin-env]
      NODE_ENV: production
      PORT: 4001
      SERVICE_NAME: auth-service
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USERNAME: auth_service_user
      DB_PASSWORD: auth_service_password
      DB_DATABASE: auth_db
      DB_SSL: "false"
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me_32_chars_min}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ora.auth.events
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe123!}
      LOG_LEVEL: info
    depends_on:
      auth-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # user-service + its database
  # ---------------------------------------------------------------------
  user-db:
    image: postgres:16-alpine
    container_name: ora-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: user_service_password
      POSTGRES_DB: user_db
    volumes: [user-db-data:/var/lib/postgresql/data]
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  user-service:
    build: { context: ../services/user-service, dockerfile: Dockerfile }
    container_name: ora-user-service
    restart: unless-stopped
    ports: ["4002:4002"]
    environment:
      <<: [*jwt-env, *super-admin-env]
      NODE_ENV: production
      PORT: 4002
      SERVICE_NAME: user-service
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USERNAME: user_service_user
      DB_PASSWORD: user_service_password
      DB_DATABASE: user_db
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ora.user.events
      AUTH_EXCHANGE: ora.auth.events
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Super}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Admin}
      LOG_LEVEL: info
    depends_on:
      user-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # notification-service + its database
  # ---------------------------------------------------------------------
  notification-db:
    image: postgres:16-alpine
    container_name: ora-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification_service_user
      POSTGRES_PASSWORD: notification_service_password
      POSTGRES_DB: notification_db
    volumes: [notification-db-data:/var/lib/postgresql/data]
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  notification-service:
    build: { context: ../services/notification-service, dockerfile: Dockerfile }
    container_name: ora-notification-service
    restart: unless-stopped
    ports: ["4009:4009"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4009
      SERVICE_NAME: notification-service
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_USERNAME: notification_service_user
      DB_PASSWORD: notification_service_password
      DB_DATABASE: notification_db
      DB_SSL: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ora.notification.events
      AUTH_EXCHANGE: ora.auth.events
      USER_EXCHANGE: ora.user.events
      EMAIL_PROVIDER: console
      LOG_LEVEL: info
    depends_on:
      notification-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # search-service + its database
  # search-service is a derived store — it never originates data, it
  # subscribes to *.published/*.updated/*.deleted events from every content
  # service and maintains its own Postgres full-text index (see
  # docs/01-architecture.md §3 and services/search-service/docs/erd.md).
  # None of the six content services it consumes from exist yet; the
  # *_EXCHANGE vars below are reserved so it starts indexing automatically,
  # with zero changes, the moment each one is built.
  # ---------------------------------------------------------------------
  search-db:
    image: postgres:16-alpine
    container_name: ora-search-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: search_service_user
      POSTGRES_PASSWORD: search_service_password
      POSTGRES_DB: search_db
    volumes: [search-db-data:/var/lib/postgresql/data]
    ports: ["5436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search_service_user -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  search-service:
    build: { context: ../services/search-service, dockerfile: Dockerfile }
    container_name: ora-search-service
    restart: unless-stopped
    ports: ["4010:4010"]
    environment:
      NODE_ENV: production
      PORT: 4010
      SERVICE_NAME: search-service
      DB_HOST: search-db
      DB_PORT: 5432
      DB_USERNAME: search_service_user
      DB_PASSWORD: search_service_password
      DB_DATABASE: search_db
      DB_SSL: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: ora.search.events
      JOURNAL_EXCHANGE: ora.journal.events
      EBOOK_EXCHANGE: ora.ebook.events
      LIBRARY_EXCHANGE: ora.library.events
      REPOSITORY_EXCHANGE: ora.repository.events
      WIKI_EXCHANGE: ora.wiki.events
      RESEARCHER_EXCHANGE: ora.researcher.events
      LOG_LEVEL: info
    depends_on:
      search-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # Content-module services: journal, ebook, library, wiki, repository,
  # researcher-network. Each is a STANDALONE RBAC slice — its own database,
  # its own module-specific role catalog (see each service's README/docs/erd.md),
  # zero runtime dependency on user-service or auth-service or each other for
  # authorization. Only the JWT signing secret is shared (verification-only,
  # same contract every service already uses) and, optionally, the same
  # SUPER_ADMIN_EMAIL so the one bootstrapped account becomes the top local
  # role holder in every module too, not just a platform-wide admin. Business
  # workflows (manuscript submission, book proofing, lending, wiki editing,
  # deposits, networking) are future work — this is authorization only.
  # ---------------------------------------------------------------------
  journal-db:
    image: postgres:16-alpine
    container_name: ora-journal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: journal_service_user
      POSTGRES_PASSWORD: journal_service_password
      POSTGRES_DB: journal_db
    volumes: [journal-db-data:/var/lib/postgresql/data]
    ports: ["5437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_service_user -d journal_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  journal-service:
    build: { context: ../services/journal-service, dockerfile: Dockerfile }
    container_name: ora-journal-service
    restart: unless-stopped
    ports: ["4005:4005"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4005
      SERVICE_NAME: journal-service
      DB_HOST: journal-db
      DB_PORT: 5432
      DB_USERNAME: journal_service_user
      DB_PASSWORD: journal_service_password
      DB_DATABASE: journal_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      journal-db: { condition: service_healthy }
    networks: [ora-network]

  ebook-db:
    image: postgres:16-alpine
    container_name: ora-ebook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebook_service_user
      POSTGRES_PASSWORD: ebook_service_password
      POSTGRES_DB: ebook_db
    volumes: [ebook-db-data:/var/lib/postgresql/data]
    ports: ["5438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook_service_user -d ebook_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  ebook-service:
    build: { context: ../services/ebook-service, dockerfile: Dockerfile }
    container_name: ora-ebook-service
    restart: unless-stopped
    ports: ["4006:4006"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4006
      SERVICE_NAME: ebook-service
      DB_HOST: ebook-db
      DB_PORT: 5432
      DB_USERNAME: ebook_service_user
      DB_PASSWORD: ebook_service_password
      DB_DATABASE: ebook_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      ebook-db: { condition: service_healthy }
    networks: [ora-network]

  library-db:
    image: postgres:16-alpine
    container_name: ora-library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: library_service_user
      POSTGRES_PASSWORD: library_service_password
      POSTGRES_DB: library_db
    volumes: [library-db-data:/var/lib/postgresql/data]
    ports: ["5439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_service_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  library-service:
    build: { context: ../services/library-service, dockerfile: Dockerfile }
    container_name: ora-library-service
    restart: unless-stopped
    ports: ["4007:4007"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4007
      SERVICE_NAME: library-service
      DB_HOST: library-db
      DB_PORT: 5432
      DB_USERNAME: library_service_user
      DB_PASSWORD: library_service_password
      DB_DATABASE: library_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      library-db: { condition: service_healthy }
    networks: [ora-network]

  wiki-db:
    image: postgres:16-alpine
    container_name: ora-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki_service_user
      POSTGRES_PASSWORD: wiki_service_password
      POSTGRES_DB: wiki_db
    volumes: [wiki-db-data:/var/lib/postgresql/data]
    ports: ["5440:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_service_user -d wiki_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  wiki-service:
    build: { context: ../services/wiki-service, dockerfile: Dockerfile }
    container_name: ora-wiki-service
    restart: unless-stopped
    ports: ["4008:4008"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4008
      SERVICE_NAME: wiki-service
      DB_HOST: wiki-db
      DB_PORT: 5432
      DB_USERNAME: wiki_service_user
      DB_PASSWORD: wiki_service_password
      DB_DATABASE: wiki_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      wiki-db: { condition: service_healthy }
    networks: [ora-network]

  repository-db:
    image: postgres:16-alpine
    container_name: ora-repository-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: repository_service_user
      POSTGRES_PASSWORD: repository_service_password
      POSTGRES_DB: repository_db
    volumes: [repository-db-data:/var/lib/postgresql/data]
    ports: ["5441:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repository_service_user -d repository_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  repository-service:
    build: { context: ../services/repository-service, dockerfile: Dockerfile }
    container_name: ora-repository-service
    restart: unless-stopped
    ports: ["4004:4004"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4004
      SERVICE_NAME: repository-service
      DB_HOST: repository-db
      DB_PORT: 5432
      DB_USERNAME: repository_service_user
      DB_PASSWORD: repository_service_password
      DB_DATABASE: repository_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      repository-db: { condition: service_healthy }
    networks: [ora-network]

  researcher-db:
    image: postgres:16-alpine
    container_name: ora-researcher-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: researcher_service_user
      POSTGRES_PASSWORD: researcher_service_password
      POSTGRES_DB: researcher_db
    volumes: [researcher-db-data:/var/lib/postgresql/data]
    ports: ["5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher_service_user -d researcher_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ora-network]

  researcher-service:
    build: { context: ../services/researcher-service, dockerfile: Dockerfile }
    container_name: ora-researcher-service
    restart: unless-stopped
    ports: ["4003:4003"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 4003
      SERVICE_NAME: researcher-service
      DB_HOST: researcher-db
      DB_PORT: 5432
      DB_USERNAME: researcher_service_user
      DB_PASSWORD: researcher_service_password
      DB_DATABASE: researcher_db
      DB_SSL: "false"
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@ora.local}
      LOG_LEVEL: info
    depends_on:
      researcher-db: { condition: service_healthy }
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # gateway — the single entry point for testing everything above
  # ---------------------------------------------------------------------
  gateway:
    build: { context: ../services/gateway, dockerfile: Dockerfile }
    container_name: ora-gateway
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 8080
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:4001
      USER_SERVICE_URL: http://user-service:4002
      NOTIFICATION_SERVICE_URL: http://notification-service:4009
      SEARCH_SERVICE_URL: http://search-service:4010
      # Not yet built — routes registered but return 503 until deployed (see service-registry.ts).
      RESEARCHER_SERVICE_URL: http://researcher-service:4003
      REPOSITORY_SERVICE_URL: http://repository-service:4004
      JOURNAL_SERVICE_URL: http://journal-service:4005
      EBOOK_SERVICE_URL: http://ebook-service:4006
      LIBRARY_SERVICE_URL: http://library-service:4007
      WIKI_SERVICE_URL: http://wiki-service:4008
      # Not yet built — route registered but returns 503 until deployed.
      MONITORING_SERVICE_URL: http://monitoring-service:4011
      LOG_LEVEL: info
    depends_on:
      - auth-service
      - user-service
      - notification-service
      - search-service
      - journal-service
      - ebook-service
      - library-service
      - wiki-service
      - repository-service
      - researcher-service
    networks: [ora-network]

  # ---------------------------------------------------------------------
  # web — the React frontend (auth flows + dashboard shell), served as
  # static files behind Nginx. Vite bakes VITE_* env vars into the bundle
  # at BUILD time (unlike every backend service's runtime env vars), so
  # the gateway URL is passed as a build-arg rather than a container env
  # var — see web/Dockerfile.
  # ---------------------------------------------------------------------
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: ora-web
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      - gateway
    networks: [ora-network]

networks:
  ora-network:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  notification-db-data:
  search-db-data:
  journal-db-data:
  ebook-db-data:
  library-db-data:
  wiki-db-data:
  repository-db-data:
  researcher-db-data:
